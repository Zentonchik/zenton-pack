[debug]
	# Название: Отладка ингредиентов
	# Описание: Записывать в журнал добавленные и обновлённые ингредиенты фильтра JEI.
	# Допустимые значения: [true, false]
	# Значение по умолчанию: false
	debugIngredientsEnabled = false

	# Название: Отладка интерфейсов
	# Описание: Включить режим отладки интерфейсов
	# Допустимые значения: [true, false]
	# Значение по умолчанию: false
	debugGuis = false

	# Название: Отладка ввода
	# Описание: Включить режим отладки ввода
	# Допустимые значения: [true, false]
	# Значение по умолчанию: false
	debugInputs = false

	# Название: Отладочные подсказки
	# Описание: Добавлять отладочную информацию в подсказки ингредиентов при включённых расширенных подсказках.
	# Допустимые значения: [true, false]
	# Значение по умолчанию: false
	debugInfoTooltipsEnabled = false

	# Название: Статистика дерева поиска в журнал
	# Описание: Записывать в журнал сведения о суффиксных деревьях поиска для отладки JEI.
	# Допустимые значения: [true, false]
	# Значение по умолчанию: false
	logSuffixTreeStats = false


